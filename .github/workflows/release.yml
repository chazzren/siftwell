name: Release

# Run by hand: Actions -> Release -> Run workflow -> enter a version -> Run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.0 (no leading v)"
        required: true
        type: string
      notes:
        description: "Optional extra text for the top of the release notes"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      EXTRA_NOTES: ${{ inputs.notes }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate version and branch
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version '$VERSION' is not like 0.2.0 (three numbers, no leading v)."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow from the '$DEFAULT_BRANCH' branch (it was run from '$GITHUB_REF_NAME')."
            exit 1
          fi

      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if the tag already exists
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Pick a new version."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Release checks
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: python scripts/release_check.py

      - name: Write version, commit and tag (local only until the ZIP is verified)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Release notes are built from the commits since the previous v* tag, before our own commit exists.
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          echo "PREV_TAG=$PREV" >> "$GITHUB_ENV"
          printf '%s\n' "$VERSION" > VERSION
          git add VERSION
          git commit --allow-empty -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "Siftwell v$VERSION"

      - name: Build the ZIP and check executable bits
        run: |
          ZIP="Siftwell-$VERSION.zip"
          git archive --format=zip --prefix=Siftwell/ -o "$ZIP" "v$VERSION"
          zipinfo "$ZIP"
          missing=0
          count=0
          while IFS= read -r line; do
            count=$((count + 1))
            case "$line" in
              -rwx*) ;;
              *) echo "::error::Not executable in the ZIP: ${line##* }"; missing=1 ;;
            esac
          done < <(zipinfo "$ZIP" | grep -E '\.command$' || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::No .command launcher found in the ZIP."
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::A .command file lost its executable bit. Run: git update-index --chmod=+x \"Start Siftwell.command\", commit, and re-run."
            exit 1
          fi
          echo "$count .command file(s) keep the executable bit."

      - name: Write release notes
        run: |
          {
            if [ -n "$EXTRA_NOTES" ]; then printf '%s\n\n' "$EXTRA_NOTES"; fi
            echo "## Changes"
            if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..HEAD"; else RANGE="HEAD"; fi
            git log --no-merges --pretty=format:'- %s' "$RANGE" | grep -v '^- Release v' || true
            echo
            echo
            echo "## Install"
            echo "Download **Siftwell-$VERSION.zip** below, unzip it, and open the Start Siftwell file for your system."
          } > release_notes.md
          cat release_notes.md

      - name: Push commit and tag
        run: git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$VERSION"

      - name: Create the GitHub Release
        run: |
          FLAGS=()
          if [[ "$VERSION" == 0.* ]]; then FLAGS+=(--prerelease); fi
          gh release create "v$VERSION" "Siftwell-$VERSION.zip" \
            --title "Siftwell v$VERSION" \
            --notes-file release_notes.md \
            --verify-tag \
            "${FLAGS[@]}"
