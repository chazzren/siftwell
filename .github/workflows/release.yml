name: Release

# Run by hand: Actions -> Release -> Run workflow -> enter a version -> Run.
#
# check    (Linux)   validates the version and runs the release checks.
# windows  (Windows) builds Siftwell.exe with PyInstaller, then Siftwell-Setup-<version>.exe with Inno Setup, and
#                    Siftwell-Portable-<version>.zip (the same bundle plus portable.txt and README-portable.txt).
# macos    (macOS)   builds Siftwell.app with PyInstaller (installer/siftwell-mac.spec, Apple silicon), packs it into
#                    Siftwell-<version>.dmg and smoke tests that .dmg (installer/build_mac.sh, installer/smoke_mac.sh).
# publish  (Linux)   only after all of the above passed: writes VERSION, tags, builds the ZIP, pushes, and creates the
#                    GitHub Release with the ZIP, the installer, the portable ZIP and the .dmg attached together. Nothing is
#                    pushed or published before every file exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.0 (no leading v)"
        required: true
        type: string
      notes:
        description: "Optional extra text for the top of the release notes"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Validate version and branch
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version '$VERSION' is not like 0.2.0 (three numbers, no leading v)."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow from the '$DEFAULT_BRANCH' branch (it was run from '$GITHUB_REF_NAME')."
            exit 1
          fi

      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if the tag already exists
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Pick a new version."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Release checks
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: python scripts/release_check.py

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the commit that passed the checks
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Write the version (the same VERSION the release commit will carry)
        run: Set-Content -Path VERSION -Value $env:VERSION -Encoding ascii

      - name: Install the build tools and Siftwell's packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build Siftwell.exe (PyInstaller, one-folder bundle)
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build installer/siftwell.spec

      - name: Check the bundle starts
        run: |
          $out = (& dist\Siftwell\Siftwell.exe --version | Out-String).Trim()
          Write-Host "Siftwell.exe --version -> '$out'"
          if ($out -ne $env:VERSION) { throw "Expected '$env:VERSION' from Siftwell.exe --version" }
          "{0:N1} MB" -f ((Get-ChildItem dist\Siftwell -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Find or install Inno Setup
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            foreach ($d in "${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6", "${env:ProgramFiles(x86)}\Inno Setup 7", "$env:ProgramFiles\Inno Setup 7") {
              if (Test-Path "$d\ISCC.exe") { $iscc = "$d\ISCC.exe"; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            foreach ($d in "${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6", "${env:ProgramFiles(x86)}\Inno Setup 7", "$env:ProgramFiles\Inno Setup 7") {
              if (Test-Path "$d\ISCC.exe") { $iscc = "$d\ISCC.exe"; break }
            }
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) was not found" }
          "ISCC=$($iscc.ToString())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Siftwell-Setup-<version>.exe (Inno Setup)
        run: |
          & $env:ISCC "/DOutDir=$PWD\installer-out" "/DBundleDir=$PWD\dist\Siftwell" installer\siftwell.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem installer-out | Format-Table Name, Length

      - name: Build Siftwell-Portable-<version>.zip (the bundle + portable.txt + README-portable.txt)
        run: |
          $stage = "portable-stage"
          New-Item -ItemType Directory -Force $stage, installer-out | Out-Null
          Copy-Item dist\Siftwell "$stage\Siftwell" -Recurse
          Copy-Item installer\portable\portable.txt "$stage\Siftwell\portable.txt"
          Copy-Item installer\portable\README-portable.txt "$stage\Siftwell\README-portable.txt"
          $zip = "installer-out\Siftwell-Portable-$env:VERSION.zip"
          Compress-Archive -Path "$stage\Siftwell" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "$zip was not built" }
          # unzip somewhere else and run it: the version answers and nothing is written outside the folder
          $t = "$env:RUNNER_TEMP\sw-portable"
          Expand-Archive $zip -DestinationPath $t -Force
          foreach ($f in "Siftwell\Siftwell.exe", "Siftwell\portable.txt", "Siftwell\README-portable.txt") {
            if (-not (Test-Path "$t\$f")) { throw "$f is missing from the portable ZIP" }
          }
          $out = (& "$t\Siftwell\Siftwell.exe" --version | Out-String).Trim()
          if ($out -ne $env:VERSION) { throw "Portable Siftwell.exe reports '$out'" }
          "{0:N1} MB" -f ((Get-Item $zip).Length / 1MB)

      - name: Test install, start and uninstall (scratch folders, data kept)
        run: |
          $setup = "installer-out\Siftwell-Setup-$env:VERSION.exe"
          if (-not (Test-Path $setup)) { throw "$setup was not built" }
          $env:JOBBOARD_DATA = "$env:RUNNER_TEMP\sw-data"
          New-Item -ItemType Directory -Force $env:JOBBOARD_DATA | Out-Null
          Set-Content "$env:JOBBOARD_DATA\keep.txt" "keep"
          $dir = "$env:RUNNER_TEMP\sw-app"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\Siftwell.exe")) { throw "Siftwell.exe was not installed" }
          $out = (& "$dir\Siftwell.exe" --version | Out-String).Trim()
          if ($out -ne $env:VERSION) { throw "Installed Siftwell.exe reports '$out'" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$dir\Siftwell.exe") { throw "Uninstall left Siftwell.exe behind" }
          if (-not (Test-Path "$env:JOBBOARD_DATA\keep.txt")) { throw "Uninstall removed the user's data" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            installer-out/Siftwell-Setup-${{ inputs.version }}.exe
            installer-out/Siftwell-Portable-${{ inputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: check
    runs-on: macos-15
    steps:
      - name: Check out the commit that passed the checks
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Write the version (the same VERSION the release commit will carry)
        run: printf '%s\n' "$VERSION" > VERSION

      - name: Install the build tools and Siftwell's packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build Siftwell.app and Siftwell-<version>.dmg (PyInstaller + hdiutil, Apple silicon)
        run: bash installer/build_mac.sh installer-out

      - name: Smoke test the .dmg (mounts, version, window libraries load, server answers, --stop stops it)
        run: bash installer/smoke_mac.sh "installer-out/Siftwell-$VERSION.dmg" "$VERSION" 8871

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: installer-out/Siftwell-${{ inputs.version }}.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, windows, macos]
    runs-on: ubuntu-latest
    env:
      EXTRA_NOTES: ${{ inputs.notes }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if the tag already exists
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Pick a new version."
            exit 1
          fi

      - name: Download the Windows installer and the portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Download the Mac .dmg
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg

      - name: Check the installer, the portable ZIP and the .dmg are there
        run: |
          ls -l "Siftwell-Setup-$VERSION.exe" "Siftwell-Portable-$VERSION.zip" "Siftwell-$VERSION.dmg"
          test -s "Siftwell-Setup-$VERSION.exe"
          test -s "Siftwell-Portable-$VERSION.zip"
          test -s "Siftwell-$VERSION.dmg"

      - name: Write version, commit and tag (local only until everything is verified)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Release notes are built from the commits since the previous v* tag, before our own commit exists.
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          echo "PREV_TAG=$PREV" >> "$GITHUB_ENV"
          printf '%s\n' "$VERSION" > VERSION
          git add VERSION
          git commit --allow-empty -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "Siftwell v$VERSION"

      - name: Build the ZIP and check executable bits
        run: |
          ZIP="Siftwell-$VERSION.zip"
          git archive --format=zip --prefix=Siftwell/ -o "$ZIP" "v$VERSION"
          zipinfo "$ZIP"
          missing=0
          count=0
          while IFS= read -r line; do
            count=$((count + 1))
            case "$line" in
              -rwx*) ;;
              *) echo "::error::Not executable in the ZIP: ${line##* }"; missing=1 ;;
            esac
          done < <(zipinfo "$ZIP" | grep -E '\.command$' || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::No .command launcher found in the ZIP."
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::A .command file lost its executable bit. Run: git update-index --chmod=+x \"Start Siftwell.command\", commit, and re-run."
            exit 1
          fi
          echo "$count .command file(s) keep the executable bit."

      - name: Write release notes
        run: |
          {
            if [ -n "$EXTRA_NOTES" ]; then printf '%s\n\n' "$EXTRA_NOTES"; fi
            echo "## Changes"
            if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..HEAD"; else RANGE="HEAD"; fi
            git log --no-merges --pretty=format:'- %s' "$RANGE" | grep -v '^- Release v' || true
            echo
            echo
            echo "## Install"
            echo "**Windows:** download **Siftwell-Setup-$VERSION.exe** below, run it, and click Next, then Install. (Windows may say \"Windows protected your PC\" the first time: click More info, then Run anyway.)"
            echo
            echo "**Windows, no install:** download **Siftwell-Portable-$VERSION.zip**, unzip it anywhere (a USB stick works), and double-click Siftwell.exe. Your data stays in a data folder next to it."
            echo
            echo "**Mac (Apple silicon):** download **Siftwell-$VERSION.dmg** below, open it, and drag Siftwell onto Applications. The first time, macOS asks whether you trust it: see the steps in the guide (Install, Mac)."
            echo
            echo "**Mac with an Intel chip, or Windows without the installer:** download **Siftwell-$VERSION.zip** below, unzip it, and open the Start Siftwell file for your system."
          } > release_notes.md
          cat release_notes.md

      - name: Push commit and tag
        run: git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$VERSION"

      - name: Create the GitHub Release (ZIP, installer, portable ZIP and .dmg together)
        run: |
          FLAGS=()
          if [[ "$VERSION" == 0.* ]]; then FLAGS+=(--prerelease); fi
          gh release create "v$VERSION" "Siftwell-$VERSION.zip" "Siftwell-Setup-$VERSION.exe" "Siftwell-Portable-$VERSION.zip" "Siftwell-$VERSION.dmg" \
            --title "Siftwell v$VERSION" \
            --notes-file release_notes.md \
            --verify-tag \
            "${FLAGS[@]}"
