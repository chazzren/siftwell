name: Employer directory

# Builds the Siftwell employer directory once a week (and on demand: Actions -> Employer directory -> Run workflow)
# and publishes it on the `index` branch of this repository as a single commit, force-pushed each run. The app reads it
# from raw.githubusercontent.com (directory.py); it is not a GitHub Release, so the app's update check never sees it.
#
# The builder (scripts/build_index.py) is stdlib Python. It reads public sources only; the optional keyed sources run
# only when their secrets exist (Settings -> Secrets and variables -> Actions):
#   USAJOBS_API_KEY, USAJOBS_EMAIL           federal job postings (free key: https://developer.usajobs.gov/). Nothing
#                                            else to switch on: the next run pulls every state's public postings.
#   CAREERONESTOP_TOKEN, CAREERONESTOP_USERID  CareerOneStop job postings. OFF BY DEFAULT even with these set: its terms
#                                            need CareerOneStop's logo next to the data and that isn't built or cleared
#                                            yet (scripts/index_build/postings.py). Only then: also set the repository
#                                            variable CAREERONESTOP_ENABLE to 1.
# Keys are only passed to the builder as environment variables; nothing it publishes contains them.
#
# Two runs a week:
#   Monday    the full build: discovery (about 30-60 minutes, including 45 minutes of Web Data Commons domains), then
#             reading boards, time-boxed (--minutes) so the job stays well inside the 6-hour limit. Boards not reached
#             this week are read first next week (the builder's state lives in _state/ on the index branch).
#   Thursday  discovery only: nothing but Web Data Commons employer domains (their own careers sites) for up to 4.5
#             hours, about 24 domains at a time, each on its own host with robots.txt and pacing respected. Together the
#             two runs go round the whole domain list every week or two (it used to take most of a year). The boards it
#             finds are read by Monday's run.
on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays 06:17 UTC: the full build
    - cron: "17 6 * * 4"        # Thursdays 06:17 UTC: discovery of employers' own careers sites only
  workflow_dispatch:
    inputs:
      states:
        description: "Only these states (comma-separated, e.g. OH,CO). Empty = all"
        required: false
        type: string
      minutes:
        description: "Minutes for reading job boards (time box)"
        required: false
        default: "270"
        type: string
      limit:
        description: "Read at most this many boards (empty = no limit)"
        required: false
        type: string
      discover_only:
        description: "Discovery only (Web Data Commons domains; no reading, no postings)"
        required: false
        default: false
        type: boolean
      allow_shrink:
        description: "Publish even if the new directory is much smaller than the last one (only after checking why)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: employer-directory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Check out the app (default branch)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bring back the previous directory (builder state and files)
        # "The branch doesn't exist" (a first build) and "the fetch failed" are different things: a network hiccup
        # must never be taken for a first build, or this run would rebuild from nothing and force-push over the
        # directory. So ask the server whether the branch exists (exit code 2 = it doesn't), and stop on any error.
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          set +e
          git ls-remote --exit-code --heads origin index >/dev/null 2>"$RUNNER_TEMP/lsremote.err"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            ok=""
            for try in 1 2 3; do
              if git fetch --depth=1 origin index; then ok=1; break; fi
              echo "Fetching the index branch failed (try $try); waiting before the next try."
              sleep $((try * 20))
            done
            if [ -z "$ok" ]; then
              echo "::error::The index branch exists but could not be fetched. Stopping so the published directory is not overwritten by an empty rebuild."
              exit 1
            fi
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/out"
            cp "$RUNNER_TEMP/out/manifest.json" "$RUNNER_TEMP/previous-manifest.json" 2>/dev/null || true
            echo "Previous directory restored."
          elif [ "$rc" -eq 2 ]; then
            echo "No index branch yet: first build."
          else
            cat "$RUNNER_TEMP/lsremote.err" || true
            echo "::error::Could not ask GitHub whether the index branch exists (git ls-remote exit $rc). Stopping rather than treating this as a first build."
            exit 1
          fi

      - name: Build the directory
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          CAREERONESTOP_TOKEN: ${{ secrets.CAREERONESTOP_TOKEN }}
          CAREERONESTOP_USERID: ${{ secrets.CAREERONESTOP_USERID }}
          CAREERONESTOP_ENABLE: ${{ vars.CAREERONESTOP_ENABLE }}
          DISCOVER_ONLY: ${{ (github.event.schedule == '17 6 * * 4' || inputs.discover_only) && '1' || '' }}
          STATES: ${{ inputs.states }}
          MINUTES: ${{ inputs.minutes || '270' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(--out "$RUNNER_TEMP/out" --work "$RUNNER_TEMP/work")
          if [ -n "$DISCOVER_ONLY" ]; then
            args+=(--no-cc --no-ct --no-read --no-postings --wd-sites 0 --wdc 100000 --wdc-minutes 270)
          else
            args+=(--minutes "$MINUTES")
            if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          fi
          if [ -n "$STATES" ]; then args+=(--states "$STATES"); fi
          python -X utf8 scripts/build_index.py "${args[@]}"
          du -sh "$RUNNER_TEMP/out"
          cat "$RUNNER_TEMP/out/manifest.json" | head -c 3000

      - name: Refuse to publish a directory that shrank drastically
        # Compares the new manifest with the one restored above: total employers and total size of the state files.
        # Under 60% of either (or far fewer states) stops the run before anything is pushed. A manual run with
        # "allow_shrink" ticked goes ahead (after someone has looked at why). A run limited to some states keeps the
        # other states' entries from the previous manifest, so the totals stay comparable.
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
        run: |
          python -X utf8 - "$RUNNER_TEMP/previous-manifest.json" "$RUNNER_TEMP/out/manifest.json" <<'PY'
          import json, os, sys
          prev_path, new_path = sys.argv[1], sys.argv[2]
          if not os.path.exists(prev_path):
              print("No previous directory to compare with (first build)."); sys.exit(0)
          try:
              prev = json.load(open(prev_path, encoding="utf-8"))
          except ValueError:
              print("The previous manifest could not be read; nothing to compare with."); sys.exit(0)
          try:
              new = json.load(open(new_path, encoding="utf-8"))
          except (OSError, ValueError) as e:
              print(f"::error::The new manifest is missing or unreadable ({e}). Not publishing."); sys.exit(1)
          def totals(m):
              st = m.get("states") or {}
              return (len(st), sum(int(v.get("employers") or 0) for v in st.values()), sum(int(v.get("bytes") or 0) for v in st.values()))
          (ps, pe, pb), (ns, ne, nb) = totals(prev), totals(new)
          print(f"Previous: {ps} state files, {pe:,} employers, {pb:,} bytes. New: {ns} state files, {ne:,} employers, {nb:,} bytes.")
          problems = []
          if pe >= 200 and ne < 0.6 * pe:
              problems.append(f"employers fell from {pe:,} to {ne:,}")
          if pb >= 100_000 and nb < 0.6 * pb:
              problems.append(f"state files shrank from {pb:,} to {nb:,} bytes")
          if ps >= 5 and ns < 0.8 * ps:
              problems.append(f"state files fell from {ps} to {ns}")
          if not problems:
              print("Size check passed."); sys.exit(0)
          msg = "The new directory is much smaller than the published one: " + "; ".join(problems) + "."
          if os.environ.get("ALLOW_SHRINK"):
              print(f"::warning::{msg} Publishing anyway because allow_shrink was ticked."); sys.exit(0)
          print(f"::error::{msg} Not publishing. If this is expected, run the workflow by hand with allow_shrink ticked.")
          sys.exit(1)
          PY

      - name: Publish to the index branch (one commit, force-pushed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/out"
          rm -rf .git
          git init -q -b index
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Employer directory $(date -u +%F)"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" index:index
          echo "Published $(git ls-files | wc -l) files to the index branch."
